spring.application.name=stockflow-api

# Conexion local SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StockFlowDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:spring_user}
spring.datasource.password=${DB_PASS:Password123!}

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true